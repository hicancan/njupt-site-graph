selectors:
  homepage:
    nav: ""
    module_links: ""
  list:
    item_container: ""
  detail:
    title_candidates: []
    content_candidates: []
    attachments: ""

page_classification:
  list_patterns: []
  detail_patterns: []
  attachment_extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, zip, rar]

link_classification:
  external_system_labels: [学生登录, 单位登录, 学校登录, 91job, 智慧就业平台]
  external_policy_domains: [moe.gov.cn, gov.cn, jiangsu.gov.cn, jyt.jiangsu.gov.cn, 91job.org.cn]

sections: []

site:
  id: cs
  name: 计算机学院、软件学院、网络空间安全学院
  base_url: https://cs.njupt.edu.cn/
  domain: cs.njupt.edu.cn
  owner_unit: 南京邮电大学计算机学院、软件学院、网络空间安全学院

crawl_policy:
  timeout_seconds: 20
  max_pages_safety: 50
  same_domain_only_for_content: true
  external_link_policy: record_only
  attachment_policy: metadata_only
  auto_discover_sections_from_homepage: false
  follow_inline_section_links: false
  direct_detail_backfill: false

selectors:
  homepage:
    nav: "#nav a, .wp-menu a, .wp_nav a, .nav a, a[href]"
    module_links: "a[href]"
    module_labels: [学院新闻, 通知公告, 学生工作, 本科教学, 研究生教学, 科研工作, 下载专区, 招聘高水平师资计划]
  list:
    item_container: ".news_list.list2, .news_list2.list2, .col_news_con .news_list, .col_news_list .news_list"
    pagination_next_text: "下一页"
  detail:
    title_candidates: [".arti_title", ".articleTitle", ".col_title", ".news_title", "h1", "title"]
    meta_text: "body"
    content_candidates: [".wp_articlecontent", ".article", ".entry", ".read", ".article_content", ".news_content", ".v_news_content", "#wp_content_w6_0", ".col_news_con", ".content", "main", "body"]
    attachments: "a[href]"

page_classification:
  list_patterns: ["/list.htm", "/list[0-9]+.htm", "/list.psp", "/list[0-9]+.psp"]
  detail_patterns: ["/20*/**/page.htm", "/20*/**/page.psp"]
  attachment_extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, zip, rar]

link_classification:
  external_system_labels: [领导信箱, 书记信箱, 院长信箱, 智慧校园]
  external_policy_domains: [moe.gov.cn, gov.cn, jiangsu.gov.cn, jyt.jiangsu.gov.cn]

sections:
  - section_id: cs_news
    site_id: cs
    name: 学院新闻
    url: https://cs.njupt.edu.cn/18737/list.htm
    section_type: list
    nav_path: [学院新闻]
    crawlable: true
    business_tags: [news, school]
    pagination: {type: next_link, max_pages_safety: 50}
    item_container_selector: ".news_list.list2, .news_list2"
  - section_id: cs_notice
    site_id: cs
    name: 通知公告
    url: https://cs.njupt.edu.cn/18738/list.htm
    section_type: list
    nav_path: [通知公告]
    crawlable: true
    business_tags: [notice, school]
    pagination: {type: next_link, max_pages_safety: 50}
    item_container_selector: ".news_list.list2, .news_list2"
  - section_id: cs_student_work
    site_id: cs
    name: 学生工作
    url: https://cs.njupt.edu.cn/18733/list.htm
    section_type: list
    nav_path: [学生工作]
    crawlable: true
    business_tags: [student_affairs, school]
    pagination: {type: next_link, max_pages_safety: 50}
    item_container_selector: ".news_list.list2, .news_list2.list2"
  - section_id: cs_download
    site_id: cs
    name: 下载专区
    url: https://cs.njupt.edu.cn/18735/list.htm
    section_type: resource_list
    nav_path: [下载专区]
    crawlable: true
    business_tags: [resource, download, school]
    pagination: {type: next_link, max_pages_safety: 50}
    item_container_selector: ".news_list.list2, .news_list2.list2"

site:
  id: jwc
  name: 本科生院 / 教务处
  base_url: https://jwc.njupt.edu.cn/
  domain: jwc.njupt.edu.cn
  adapter: njupt_wp
  owner_unit: 南京邮电大学本科生院 / 教务处
  reference_site: true
  notes: First reference site for the static-site-graph modeling protocol.

crawl_policy:
  timeout_seconds: 20
  max_pages_safety: 500
  same_domain_only_for_content: true
  external_link_policy: record_only
  attachment_policy: metadata_only
  chrome_required_for_modeling: true
  audit_evidence_ref: ../reports/audit_evidence.md
  auto_discover_sections_from_homepage: true

selectors:
  homepage:
    nav: "a"
    module_links: "a[href]"
  list:
    item_container: ".news_list.list2"
    item: null
    title: null
    date: null
    link: null
    pagination_next_text: "下一页"
  detail:
    title_candidates: [".arti_title", ".articleTitle", ".news_title", "h1", "title"]
    meta_text: "body"
    content_candidates: [".wp_articlecontent", ".article", ".article_content", ".news_content", ".v_news_content", "#wp_content_w6_0", ".content", "main", "body"]
    attachments: "a[href]"

page_classification:
  list_patterns:
    - "/list.htm"
    - "/list[0-9]+.htm"
  detail_patterns:
    - "/20*/**/page.htm"
  attachment_extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, zip, rar]

link_classification:
  external_system_labels:
    - 教务管理系统
    - 自主学分系统
    - 创新管理系统
    - 毕业设计系统
    - 考试信息查询
    - 作息时间查询
    - 教学进程查询
    - 学科竞赛系统
  external_policy_domains:
    - moe.gov.cn
    - gov.cn
    - jiangsu.gov.cn
    - jyt.jiangsu.gov.cn

sections:
  - section_id: jwc_rules_root
    site_id: jwc
    name: 规章制度
    url: https://jwc.njupt.edu.cn/1746/list.htm
    section_type: list
    nav_path: [规章制度]
    crawlable: true
    business_tags: [policy, regulation]
    pagination:
      type: next_link
      max_pages_safety: 500
    item_container_selector: ".news_list.list2"

  - section_id: jwc_download_student_forms

# This file is intentionally explicit for Claude Code.
# It records the required modeling inventory for the JWC reference site.
required_page_families:
  - homepage
  - global_nav_tree
  - homepage_news_module
  - homepage_notice_module
  - homepage_jw_news_module
  - homepage_teaching_reform_module
  - homepage_external_opinion_module
  - comprehensive_service_links
  - undergraduate_teaching_project_links
  - footer_internal_links
  - footer_external_links
  - section_list_page
  - pagination_page
  - detail_article_page
  - low_content_detail_page
  - direct_attachment_item
  - external_system_link
  - external_policy_link
  - cross_domain_article_link
  - inline_image
  - inline_body_link
  - attachment_metadata

must_audit_with_chrome:
  - https://jwc.njupt.edu.cn/
  - https://jwc.njupt.edu.cn/1746/list.htm
  - https://jwc.njupt.edu.cn/1690/list.htm
  - https://jwc.njupt.edu.cn/2026/0327/c1594a298565/page.htm
  - https://jwc.njupt.edu.cn/2026/0518/c1594a302043/page.htm

known_risks:
  - Homepage exposes many nav nodes and many external links; do not treat every link as a crawlable internal section.
  - List items may be internal detail pages, direct attachments, or external policy links.
  - Some detail pages are low-content and must not be treated as extraction success only because HTTP status is OK.
  - Homepage dates may be MM-DD and need detail-page reconciliation.
  - Pagination totals may vary across pages; manifest must record observed values per page.

site:
  id: lib
  name: 图书馆
  base_url: https://lib.njupt.edu.cn/
  domain: lib.njupt.edu.cn
  adapter: njupt_wp
  owner_unit: 南京邮电大学图书馆
  notes: Chrome DevTools audited WebPlus source for library services and resources.

crawl_policy:
  timeout_seconds: 20
  max_pages_safety: 500
  same_domain_only_for_content: true
  external_link_policy: record_only
  attachment_policy: metadata_only
  chrome_required_for_modeling: true
  auto_discover_sections_from_homepage: true

selectors:
  homepage:
    nav: "#nav a, .wp-menu a, .wp_nav a, .nav a, a[href]"
    module_links: "a[href]"
    module_labels: [新闻动态, 通知公告, 电子资源, 读者服务, 热门服务, 图书馆指南]
  list:
    item_container: ".news_list.list2, .news_list2.list2, .col_news_con .news_list, .col_news_list .news_list"
    pagination_next_text: "下一页"
  detail:
    title_candidates: [".arti_title", ".articleTitle", ".col_title", ".news_title", "h1", "title"]
    meta_text: "body"
    content_candidates: [".wp_articlecontent", ".article", ".entry", ".read", ".article_content", ".news_content", ".v_news_content", "#wp_content_w6_0", ".col_news_con", ".content", "main", "body"]
    attachments: "a[href]"

page_classification:
  list_patterns: ["/list.htm", "/list[0-9]+.htm", "/list.psp", "/list[0-9]+.psp"]
  detail_patterns: ["/20*/**/page.htm", "/20*/**/page.psp"]
  attachment_extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, zip, rar]

link_classification:
  external_system_labels: [我的图书馆, 馆藏目录, 一站式检索, 站内检索, 论文提交, 研读室预约]
  external_policy_domains: [moe.gov.cn, gov.cn, jiangsu.gov.cn, jyt.jiangsu.gov.cn]

sections:
  - section_id: lib_notice
    site_id: lib
    name: 通知公告
    url: https://lib.njupt.edu.cn/1429/list.htm
    section_type: list
    nav_path: [新闻资讯, 通知公告]
    crawlable: true
    business_tags: [notice, library]
    pagination: {type: next_link, max_pages_safety: 500}
    item_container_selector: ".news_list.list2, .news_list2.list2"

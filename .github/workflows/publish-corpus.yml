name: Publish NJUPT Corpus

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-njupt-corpus
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: hicancan/static-site-graph
          path: _framework/static-site-graph

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v8.2.0

      - uses: oras-project/setup-oras@v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.3/oras_1.3.3_linux_amd64.tar.gz
          checksum: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59

      - name: Install the two producer layers
        run: |
          uv venv
          uv pip install -e _framework/static-site-graph zstandard
          uv pip install --no-deps -e .

      - name: Sign in to the artifact registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Restore the current SitePackages
        id: previous
        run: |
          set -euo pipefail
          mkdir -p artifact
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER}/njupt-corpus"
          if ! oras resolve "$registry:current" >/dev/null 2>&1; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "No current corpus artifact exists; this run is the explicit bootstrap crawl."
            exit 0
          fi

          mkdir artifact/previous
          oras pull "$registry:current" --output artifact/previous
          mapfile -t packages_archives < <(
            find artifact/previous -maxdepth 1 -type f \
              -name 'njupt-site-packages-*.tar.zst' -printf '%f\n'
          )
          if [ "${#packages_archives[@]}" -ne 1 ]; then
            echo "::error::The current corpus artifact must contain exactly one SitePackages archive"
            exit 1
          fi
          asset_name="${packages_archives[0]}"
          mkdir artifact/site-packages
          tar --zstd -xf "artifact/previous/$asset_name" -C artifact/site-packages
          .venv/bin/python ops/njupt.py validate-packages \
            --packages-root artifact/site-packages
          echo "mode=incremental" >> "$GITHUB_OUTPUT"
          echo "Restored $asset_name from the current OCI artifact for incremental crawling."

      - name: Crawl and export one immutable snapshot
        run: |
          set -euo pipefail
          if [ "${{ steps.previous.outputs.mode }}" = "incremental" ]; then
            .venv/bin/python ops/njupt.py crawl \
              --packages-root artifact/site-packages \
              --jobs 4 \
              --incremental
          else
            .venv/bin/python ops/njupt.py crawl \
              --packages-root artifact/site-packages \
              --jobs 4
          fi
          .venv/bin/python ops/njupt.py validate-packages --packages-root artifact/site-packages
          .venv/bin/python ops/njupt.py summary --packages-root artifact/site-packages
          .venv/bin/python ops/njupt.py export-corpus \
            --packages-root artifact/site-packages \
            --out artifact/corpus

      - name: Package and identify the corpus
        id: corpus
        run: |
          set -euo pipefail
          corpus_id="$(python -c 'import json; print(json.load(open("artifact/corpus/manifest.json", encoding="utf-8"))["snapshot_id"])')"
          archive="njupt-corpus-${corpus_id}.tar.zst"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --zstd -cf "$archive" -C artifact/corpus .
          packages_archive="njupt-site-packages-${corpus_id}.tar.zst"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --zstd -cf "$packages_archive" -C artifact/site-packages .
          archive_sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          packages_sha256="$(sha256sum "$packages_archive" | cut -d' ' -f1)"
          artifact_id="$(
            printf '%s\0%s' "$archive_sha256" "$packages_sha256" \
              | sha256sum | cut -d' ' -f1
          )"
          echo "corpus_id=$corpus_id" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "packages_archive=$packages_archive" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Publish the corpus artifact
        id: publish
        env:
          ARCHIVE: ${{ steps.corpus.outputs.archive }}
          PACKAGES_ARCHIVE: ${{ steps.corpus.outputs.packages_archive }}
          ARTIFACT_ID: ${{ steps.corpus.outputs.artifact_id }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER}/njupt-corpus"
          oras push \
            --artifact-type application/vnd.njupt.corpus \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "$registry:$ARTIFACT_ID,current" \
            "$ARCHIVE:application/vnd.njupt.corpus+zstd" \
            "$PACKAGES_ARCHIVE:application/vnd.njupt.site-packages+zstd"
          digest="$(oras resolve "$registry:$ARTIFACT_ID")"
          test "$(oras resolve "$registry:current")" = "$digest"
          echo "corpus_ref=$registry@$digest" >> "$GITHUB_OUTPUT"

      - name: Trigger the search build with the artifact identity
        env:
          GH_TOKEN: ${{ secrets.NJUPT_SEARCH_DISPATCH_TOKEN }}
          CORPUS_REF: ${{ steps.publish.outputs.corpus_ref }}
          CORPUS_ID: ${{ steps.corpus.outputs.corpus_id }}
          CORPUS_ARCHIVE: ${{ steps.corpus.outputs.archive }}
          CORPUS_SHA256: ${{ steps.corpus.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?NJUPT_SEARCH_DISPATCH_TOKEN is required}"
          gh api repos/hicancan/njupt-search/dispatches \
            -f event_type=njupt-corpus-published \
            -F client_payload[corpus_ref]="$CORPUS_REF" \
            -F client_payload[corpus_id]="$CORPUS_ID" \
            -F client_payload[corpus_archive]="$CORPUS_ARCHIVE" \
            -F client_payload[corpus_sha256]="$CORPUS_SHA256"

name: Update Sitegraph Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_downstream_dispatch:
        description: 'Trigger njupt-search even when sitegraph data did not change'
        required: false
        type: boolean
        default: false
      dispatch_only:
        description: 'Skip crawling and only trigger njupt-search for a sitegraph ref'
        required: false
        type: boolean
        default: false
      dispatch_sitegraph_ref:
        description: 'Optional njupt-site-graph ref for dispatch_only; defaults to the workflow ref'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: update-sitegraph-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-downstream-only:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout njupt-site-graph
        uses: actions/checkout@v6

      - name: Resolve sitegraph ref
        id: resolve_sitegraph_ref
        env:
          DISPATCH_SITEGRAPH_REF: ${{ github.event.inputs.dispatch_sitegraph_ref }}
        run: |
          if [ -n "$DISPATCH_SITEGRAPH_REF" ]; then
            echo "sitegraph_ref=$DISPATCH_SITEGRAPH_REF" >> "$GITHUB_OUTPUT"
          else
            echo "sitegraph_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger downstream collection index update
        env:
          GH_TOKEN: ${{ secrets.NJUPT_SEARCH_DISPATCH_TOKEN }}
          SITEGRAPH_REF: ${{ steps.resolve_sitegraph_ref.outputs.sitegraph_ref }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::NJUPT_SEARCH_DISPATCH_TOKEN is required to trigger hicancan/njupt-search."
            exit 1
          fi
          echo "Triggering hicancan/njupt-search for sitegraph_ref=$SITEGRAPH_REF reason=manual_dispatch_only"
          gh api repos/hicancan/njupt-search/dispatches \
            -f event_type=sitegraph-data-updated \
            -F client_payload[sitegraph_ref]="$SITEGRAPH_REF" \
            -F client_payload[source_repo]="${{ github.repository }}" \
            -F client_payload[source_run_id]="${{ github.run_id }}" \
            -F client_payload[sitegraph_changed]="false" \
            -F client_payload[dispatch_reason]="manual_dispatch_only"

  read-site-matrix:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.dispatch_only != 'true'
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.sites.outputs.sites }}
    steps:
      - name: Checkout njupt-site-graph
        uses: actions/checkout@v6

      - name: Read registered sites
        id: sites
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          registry = json.loads(Path("configs/site_registry.json").read_text(encoding="utf-8"))
          site_ids = [str(site["id"]) for site in registry["sites"]]
          if not site_ids:
              raise SystemExit("configs/site_registry.json contains no sites")
          print("sites=" + json.dumps(site_ids, ensure_ascii=False, separators=(",", ":")))
          PY

  crawl-site:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.dispatch_only != 'true'
    runs-on: ubuntu-latest
    needs: read-site-matrix
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        site: ${{ fromJson(needs.read-site-matrix.outputs.sites) }}
    steps:
      - name: Checkout njupt-site-graph
        uses: actions/checkout@v6

      - name: Checkout static-site-graph
        uses: actions/checkout@v6
        with:
          repository: hicancan/static-site-graph
          path: _framework/static-site-graph

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e _framework/static-site-graph[dev]
          python -m pip install -e .[dev]

      - name: Validate site config
        run: python scripts/sitegraph_registry.py validate-configs --include "${{ matrix.site }}"

      - name: Incrementally update and validate one sitegraph package
        run: |
          for attempt in 1 2 3; do
            echo "::group::crawl ${{ matrix.site }} attempt $attempt"
            set +e
            python scripts/sitegraph_registry.py crawl --incremental --include "${{ matrix.site }}" --incremental-known-page-stop 2 --incremental-refresh-frontier 3
            crawl_status=$?
            if [ "$crawl_status" -eq 0 ]; then
              python scripts/sitegraph_registry.py validate-packages --include "${{ matrix.site }}"
              validate_status=$?
            else
              validate_status=$crawl_status
            fi
            set -e
            echo "::endgroup::"
            if [ "$validate_status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Site ${{ matrix.site }} still failed after $attempt attempts."
              exit "$validate_status"
            fi
            sleep_seconds=$((attempt * 30))
            echo "Site ${{ matrix.site }} failed with status $validate_status; retrying after ${sleep_seconds}s."
            sleep "$sleep_seconds"
          done

      - name: Summarize generated package
        run: python scripts/sitegraph_registry.py summary --include "${{ matrix.site }}"

      - name: Stage site package artifact
        run: |
          mkdir -p "_site-package/${{ matrix.site }}"
          cp -R "data/sites/${{ matrix.site }}/index" "_site-package/${{ matrix.site }}/index"

      - name: Upload site package artifact
        uses: actions/upload-artifact@v7
        with:
          name: sitegraph-package-${{ matrix.site }}
          path: _site-package/${{ matrix.site }}/
          if-no-files-found: error
          retention-days: 1

  commit-and-dispatch:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.dispatch_only != 'true'
    runs-on: ubuntu-latest
    needs: crawl-site
    steps:
      - name: Checkout njupt-site-graph
        uses: actions/checkout@v6

      - name: Checkout static-site-graph
        uses: actions/checkout@v6
        with:
          repository: hicancan/static-site-graph
          path: _framework/static-site-graph

      - name: Download site package artifacts
        uses: actions/download-artifact@v7
        with:
          path: _sitegraph-artifacts
          pattern: sitegraph-package-*

      - name: Overlay site package artifacts
        run: |
          shopt -s nullglob
          restored=0
          for artifact_dir in _sitegraph-artifacts/sitegraph-package-*; do
            site="${artifact_dir##*/sitegraph-package-}"
            if [ -d "$artifact_dir/$site/index" ]; then
              package_index="$artifact_dir/$site/index"
            elif [ -d "$artifact_dir/index" ]; then
              package_index="$artifact_dir/index"
            else
              echo "::error::Artifact for $site does not contain an index directory."
              find "$artifact_dir" -maxdepth 3 -type d -print
              exit 1
            fi
            rm -rf "data/sites/$site/index"
            mkdir -p "data/sites/$site"
            cp -R "$package_index" "data/sites/$site/index"
            restored=$((restored + 1))
          done
          if [ "$restored" -eq 0 ]; then
            echo "::error::No sitegraph package artifacts were restored."
            exit 1
          fi
          echo "Restored $restored sitegraph package artifacts."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e _framework/static-site-graph[dev]
          python -m pip install -e .[dev]

      - name: Validate generated packages
        run: |
          python -m pytest
          python scripts/sitegraph_registry.py validate-configs
          python scripts/sitegraph_registry.py summary

      - name: Commit sitegraph data changes
        id: commit_sitegraph_data
        run: |
          python scripts/commit_generated_changes.py \
            --message "Auto-update sitegraph data" \
            --add data/sites/*/index/ \
            --ref-output sitegraph_ref

      - name: Trigger downstream collection index update
        if: steps.commit_sitegraph_data.outputs.changed == 'true' || github.event.inputs.force_downstream_dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.NJUPT_SEARCH_DISPATCH_TOKEN }}
          SITEGRAPH_REF: ${{ steps.commit_sitegraph_data.outputs.sitegraph_ref }}
          SITEGRAPH_CHANGED: ${{ steps.commit_sitegraph_data.outputs.changed }}
          DISPATCH_REASON: ${{ steps.commit_sitegraph_data.outputs.changed == 'true' && 'data_changed' || 'manual_force' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::NJUPT_SEARCH_DISPATCH_TOKEN is required to trigger hicancan/njupt-search after sitegraph data changes."
            exit 1
          fi
          echo "Triggering hicancan/njupt-search for sitegraph_ref=$SITEGRAPH_REF reason=$DISPATCH_REASON"
          gh api repos/hicancan/njupt-search/dispatches \
            -f event_type=sitegraph-data-updated \
            -F client_payload[sitegraph_ref]="$SITEGRAPH_REF" \
            -F client_payload[source_repo]="${{ github.repository }}" \
            -F client_payload[source_run_id]="${{ github.run_id }}" \
            -F client_payload[sitegraph_changed]="$SITEGRAPH_CHANGED" \
            -F client_payload[dispatch_reason]="$DISPATCH_REASON"

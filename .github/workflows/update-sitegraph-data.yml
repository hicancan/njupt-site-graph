name: Update Sitegraph Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_downstream_dispatch:
        description: 'Trigger njupt-search even when sitegraph data did not change'
        required: false
        type: boolean
        default: false
      dispatch_only:
        description: 'Skip crawling and only trigger njupt-search for a sitegraph ref'
        required: false
        type: boolean
        default: false
      dispatch_sitegraph_ref:
        description: 'Optional njupt-site-graph ref for dispatch_only; defaults to the workflow ref'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: update-sitegraph-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-downstream-only:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout njupt-site-graph
        uses: actions/checkout@v4

      - name: Resolve sitegraph ref
        id: resolve_sitegraph_ref
        env:
          DISPATCH_SITEGRAPH_REF: ${{ github.event.inputs.dispatch_sitegraph_ref }}
        run: |
          if [ -n "$DISPATCH_SITEGRAPH_REF" ]; then
            echo "sitegraph_ref=$DISPATCH_SITEGRAPH_REF" >> "$GITHUB_OUTPUT"
          else
            echo "sitegraph_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger downstream collection index update
        env:
          GH_TOKEN: ${{ secrets.NJUPT_SEARCH_DISPATCH_TOKEN }}
          SITEGRAPH_REF: ${{ steps.resolve_sitegraph_ref.outputs.sitegraph_ref }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::NJUPT_SEARCH_DISPATCH_TOKEN is required to trigger hicancan/njupt-search."
            exit 1
          fi
          echo "Triggering hicancan/njupt-search for sitegraph_ref=$SITEGRAPH_REF reason=manual_dispatch_only"
          gh api repos/hicancan/njupt-search/dispatches \
            -f event_type=sitegraph-data-updated \
            -F client_payload[sitegraph_ref]="$SITEGRAPH_REF" \
            -F client_payload[source_repo]="${{ github.repository }}" \
            -F client_payload[source_run_id]="${{ github.run_id }}" \
            -F client_payload[sitegraph_changed]="false" \
            -F client_payload[dispatch_reason]="manual_dispatch_only"

  update-sitegraph-data:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.dispatch_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout njupt-site-graph
        uses: actions/checkout@v4

      - name: Checkout static-site-graph
        uses: actions/checkout@v4
        with:
          repository: hicancan/static-site-graph
          path: _framework/static-site-graph

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e _framework/static-site-graph[dev]
          python -m pip install -e .[dev]

      - name: Validate site configs
        run: |
          python -m sitegraph.cli validate-config configs/sites/jwc/site.yaml
          python -m sitegraph.cli validate-config configs/sites/xsc/site.yaml
          python -m sitegraph.cli validate-config configs/sites/cxcy/site.yaml

      - name: Incrementally update sitegraph packages
        run: |
          python -m sitegraph.cli crawl-site configs/sites/jwc/site.yaml --out data/sites/jwc/index --incremental --incremental-known-page-stop 2 --incremental-refresh-frontier 3
          python -m sitegraph.cli crawl-site configs/sites/xsc/site.yaml --out data/sites/xsc/index --incremental --incremental-known-page-stop 2 --incremental-refresh-frontier 3
          python -m sitegraph.cli crawl-site configs/sites/cxcy/site.yaml --out data/sites/cxcy/index --incremental --incremental-known-page-stop 2 --incremental-refresh-frontier 3

      - name: Validate generated packages
        run: |
          python -m pytest
          python - <<'PY'
          import json
          from pathlib import Path

          for site in ('jwc', 'xsc', 'cxcy'):
              manifest = json.loads(Path(f'data/sites/{site}/index/manifest.json').read_text(encoding='utf-8'))
              print(site, json.dumps({
                  'detail_pages': manifest['totals']['detail_pages'],
                  'attachments': manifest['totals']['attachments'],
                  'external_links': manifest['totals']['external_links'],
                  'url_outcomes': manifest['totals']['url_outcomes'],
                  'errors': manifest['quality']['errors'],
              }, ensure_ascii=False))
          PY

      - name: Commit sitegraph data changes
        id: commit_sitegraph_data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/sites/*/index/
          if git diff --staged --quiet; then
            echo "No sitegraph data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sitegraph_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update sitegraph data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sitegraph_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger downstream collection index update
        if: steps.commit_sitegraph_data.outputs.changed == 'true' || github.event.inputs.force_downstream_dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.NJUPT_SEARCH_DISPATCH_TOKEN }}
          SITEGRAPH_REF: ${{ steps.commit_sitegraph_data.outputs.sitegraph_ref }}
          SITEGRAPH_CHANGED: ${{ steps.commit_sitegraph_data.outputs.changed }}
          DISPATCH_REASON: ${{ steps.commit_sitegraph_data.outputs.changed == 'true' && 'data_changed' || 'manual_force' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::NJUPT_SEARCH_DISPATCH_TOKEN is required to trigger hicancan/njupt-search after sitegraph data changes."
            exit 1
          fi
          echo "Triggering hicancan/njupt-search for sitegraph_ref=$SITEGRAPH_REF reason=$DISPATCH_REASON"
          gh api repos/hicancan/njupt-search/dispatches \
            -f event_type=sitegraph-data-updated \
            -F client_payload[sitegraph_ref]="$SITEGRAPH_REF" \
            -F client_payload[source_repo]="${{ github.repository }}" \
            -F client_payload[source_run_id]="${{ github.run_id }}" \
            -F client_payload[sitegraph_changed]="$SITEGRAPH_CHANGED" \
            -F client_payload[dispatch_reason]="$DISPATCH_REASON"

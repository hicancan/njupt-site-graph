name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout njupt-site-graph
        uses: actions/checkout@v4

      - name: Checkout static-site-graph
        uses: actions/checkout@v4
        with:
          repository: hicancan/static-site-graph
          path: _framework/static-site-graph

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e _framework/static-site-graph[dev]
          python -m pip install -e .[dev]

      - name: Validate site configs
        run: |
          python -m sitegraph.cli validate-config configs/sites/jwc/site.yaml
          python -m sitegraph.cli validate-config configs/sites/xsc/site.yaml
          python -m sitegraph.cli validate-config configs/sites/cxcy/site.yaml

      - name: Dry-run incremental crawls
        run: |
          python -m sitegraph.cli crawl-site configs/sites/jwc/site.yaml --out data/sites/jwc/index --incremental --dry-run
          python -m sitegraph.cli crawl-site configs/sites/xsc/site.yaml --out data/sites/xsc/index --incremental --dry-run
          python -m sitegraph.cli crawl-site configs/sites/cxcy/site.yaml --out data/sites/cxcy/index --incremental --dry-run

      - name: Run tests
        run: python -m pytest

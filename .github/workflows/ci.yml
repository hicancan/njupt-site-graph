name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: hicancan/static-site-graph
          path: _framework/static-site-graph

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Install the two producer layers
        run: |
          uv venv
          uv pip install -e _framework/static-site-graph[dev] zstandard
          uv pip install --no-deps -e .[dev]

      - name: Run the network-free loop
        run: |
          uv run pytest -q
          uv run python ops/njupt.py validate-configs
          uv run python ops/njupt.py dry-run --packages-root "$RUNNER_TEMP/site-packages"

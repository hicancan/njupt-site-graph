name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout njupt-site-graph
        uses: actions/checkout@v6

      - name: Checkout static-site-graph
        uses: actions/checkout@v6
        with:
          repository: hicancan/static-site-graph
          path: _framework/static-site-graph

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e _framework/static-site-graph[dev]
          python -m pip install -e .[dev]

      - name: Validate site configs
        run: python scripts/sitegraph_registry.py validate-configs

      - name: Dry-run incremental crawls
        run: python scripts/sitegraph_registry.py dry-run --incremental

      - name: Run tests
        run: python -m pytest
